---
- name: Simulated VPN dry-run
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    request_id: "{{ request_id | default(ccsd ~ '-' ~ device_id ~ '-' ~ action ~ '-' ~ vpn_type) }}"
    dry_run_summary: |-
      ==================================
      VPN DRY-RUN RESULT
      ==================================
      Request ID : {{ request_id }}
      CCSD       : {{ ccsd }}
      Device ID  : {{ device_id }}
      Action     : {{ action }}
      VPN Type   : {{ vpn_type }}

      Proposed Changes
      ----------------
      - Validate request
      - Build simulated config
      - Prepare change for {{ device_id }}

      STATUS: DRY-RUN SUCCESSFUL

  tasks:
    - name: Show dry-run summary
      ansible.builtin.debug:
        msg: "{{ dry_run_summary }}"

    - name: Expose dry-run summary as a registered fact for this job only
      ansible.builtin.set_fact:
        dry_run_output: "{{ dry_run_summary }}"

    - name: Show next-step hint
      ansible.builtin.debug:
        msg: |
          Copy this Request ID into the approval template:
          {{ request_id }}
