---
- name: Simulated approval and apply
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    request_id: "{{ request_id | default('not provided') }}"
    decision: "{{ decision | default('reject') }}"
    comment: "{{ comment | default('') }}"

  tasks:
    - name: Show approval decision
      ansible.builtin.debug:
        msg: |
          ==================================
          VPN APPROVAL RESULT
          ==================================
          Request ID : {{ request_id }}
          Decision   : {{ decision }}
          Comment    : {{ comment }}

    - name: Simulate apply when approved
      ansible.builtin.debug:
        msg: |
          ==================================
          VPN APPLY RESULT
          ==================================
          Request ID : {{ request_id }}
          Decision   : {{ decision }}
          Comment    : {{ comment }}
          STATUS: APPLY SUCCESSFUL
          Config push simulated.
      when: decision == 'approve'

    - name: Simulate rejection when not approved
      ansible.builtin.debug:
        msg: |
          ==================================
          VPN APPLY RESULT
          ==================================
          Request ID : {{ request_id }}
          Decision   : {{ decision }}
          Comment    : {{ comment }}
          STATUS: REJECTED
          No changes were applied.
      when: decision != 'approve'
